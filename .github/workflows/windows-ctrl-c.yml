name: Windows Ctrl+C investigation

on:
  push:
    branches: [fix/windows-ctrl-c]
    paths:
      - .github/workflows/windows-ctrl-c.yml
      - patches/crossterm-windows-ctrl-c*.patch
      - scripts/diagnostics/windows_ctrl_c.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ctrl-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression (${{ matrix.name }})
    if: github.repository == 'rubo/codex'
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The crossterm revision Codex pins. Its Windows parser tests live in parse_tests.rs,
          # which already has one test.
          - name: Codex pin
            id: pin
            repository: openai-oss-forks/crossterm
            ref: ed1cdab335221515706178d68495bba2aed1924f
            toolchain: 1.95.0
            patch: crossterm-windows-ctrl-c
            parser-tests: 4
          # The upstream base for a crossterm-rs/crossterm pull request. It has no Windows parser
          # tests yet, so the tests patch adds the module.
          - name: crossterm upstream
            id: upstream
            repository: crossterm-rs/crossterm
            ref: db287b8c6873166dfe0bdb625c67e981c77164c2
            # crossterm's CI lints with the latest stable release.
            toolchain: stable
            patch: crossterm-windows-ctrl-c-upstream
            parser-tests: 3
    env:
      PATCH: ../patches/${{ matrix.patch }}
      PARSER_TESTS: ${{ matrix.parser-tests }}
    defaults:
      run:
        shell: bash
        working-directory: crossterm-under-test
    steps:
      - name: Check out the investigation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out crossterm
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: crossterm-under-test
          persist-credentials: false

      - name: Install Rust on the CI runner
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt

      - name: Add regression tests
        run: |
          set -euo pipefail
          git apply --check "$PATCH-tests.patch"
          git apply "$PATCH-tests.patch"
          mkdir -p ../ctrl-c-artifacts

      - name: Add the interactive probe
        if: matrix.id == 'pin'
        run: cp ../scripts/diagnostics/windows_ctrl_c.rs examples/codex_ctrl_c_probe.rs

      - name: Require the regression to fail before the fix
        run: |
          set -euo pipefail
          test_name=event::sys::windows::parse::tests::ctrl_letter_control_codes_report_the_letter_on_any_layout
          if cargo test --locked --lib --all-features "$test_name" -- --exact --test-threads 1 > ../ctrl-c-before.log 2>&1; then
            cat ../ctrl-c-before.log
            echo 'The unpatched regression unexpectedly passed.' >&2
            exit 1
          else
            result=$?
          fi
          cat ../ctrl-c-before.log
          if [[ "$result" != 101 ]]; then
            echo "Expected test failure exit 101, got $result." >&2
            exit 1
          fi
          output=$(<../ctrl-c-before.log)
          # A compile failure or zero discovered tests does not prove regression coverage.
          [[ "$output" == *"test $test_name ... FAILED"* ]]
          [[ "$output" == *'test result: FAILED. 0 passed; 1 failed;'* ]]

      - name: Build the unpatched interactive probe
        if: matrix.id == 'pin'
        run: |
          set -euo pipefail
          CTRL_C_PROBE_VARIANT=before-fix cargo build --locked --all-features --example codex_ctrl_c_probe
          cp target/debug/examples/codex_ctrl_c_probe.exe ../ctrl-c-artifacts/ctrl-c-before.exe

      - name: Apply the parser fix
        run: |
          set -euo pipefail
          git apply --check "$PATCH.patch"
          git apply "$PATCH.patch"

      - name: Check formatting of the changed Rust files
        if: matrix.id == 'pin'
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check src/event/sys/windows/parse.rs src/event/sys/windows/parse_tests.rs examples/codex_ctrl_c_probe.rs

      # Mirror crossterm's own CI so the pull request does not fail there first.
      - name: Check formatting and Clippy as crossterm's CI does
        if: matrix.id == 'upstream'
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features events -- -D warnings

      - name: Require all Windows parser regressions to pass
        run: |
          set -euo pipefail
          cargo test --locked --lib --all-features event::sys::windows::parse::tests:: -- --test-threads 1 | tee ../ctrl-c-after.log
          output=$(<../ctrl-c-after.log)
          [[ "$output" == *"test result: ok. $PARSER_TESTS passed; 0 failed;"* ]]

      - name: Run crossterm's full test suite
        if: matrix.id == 'upstream'
        run: cargo test --locked --all-targets --all-features -- --test-threads 1

      - name: Build the patched interactive probe
        if: matrix.id == 'pin'
        run: |
          set -euo pipefail
          CTRL_C_PROBE_VARIANT=after-fix cargo build --locked --all-features --example codex_ctrl_c_probe
          cp target/debug/examples/codex_ctrl_c_probe.exe ../ctrl-c-artifacts/ctrl-c-after.exe

      - name: Upload the before and after probes
        if: matrix.id == 'pin'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-ctrl-c-probes
          path: |
            ctrl-c-artifacts/*.exe
            scripts/diagnostics/windows_ctrl_c.rs
          if-no-files-found: error
          retention-days: 7

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-ctrl-c-test-logs-${{ matrix.id }}
          path: ctrl-c-*.log
          if-no-files-found: warn
          retention-days: 7

  codex-build:
    if: github.repository == 'rubo/codex'
    needs: regression
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/codex-target
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      STABLE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out Codex
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out Codex's pinned crossterm
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openai-oss-forks/crossterm
          ref: ed1cdab335221515706178d68495bba2aed1924f
          path: crossterm-under-test
          persist-credentials: false

      - name: Install Rust on the CI runner
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt,rust-src

      - name: Configure the native Windows linker
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Set up Python for artifact verification
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download and verify Codex's V8 build artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Apply the tested crossterm fix
        shell: bash
        run: |
          set -euo pipefail
          git -C crossterm-under-test apply --check ../patches/crossterm-windows-ctrl-c.patch
          git -C crossterm-under-test apply ../patches/crossterm-windows-ctrl-c.patch

      - name: Point this CI build at the patched source
        shell: pwsh
        run: |
          $manifestPath = Join-Path $PWD 'codex-rs/Cargo.toml'
          $manifest = [IO.File]::ReadAllText($manifestPath)
          $original = 'crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }'
          if ([regex]::Matches($manifest, [regex]::Escape($original)).Count -ne 1) {
            throw 'The crossterm dependency pin has changed; review the override.'
          }
          $manifest = $manifest.Replace($original, 'crossterm = { path = "../crossterm-under-test" }')
          [IO.File]::WriteAllText($manifestPath, $manifest)

          # Keep every resolved dependency version. Only crossterm's source changes.
          $lockPath = Join-Path $PWD 'codex-rs/Cargo.lock'
          $lock = [IO.File]::ReadAllText($lockPath)
          $source = 'source = "git+https://github.com/openai-oss-forks/crossterm?rev=ed1cdab335221515706178d68495bba2aed1924f#ed1cdab335221515706178d68495bba2aed1924f"'
          $pattern = '(?m)^' + [regex]::Escape($source) + '\r?\n'
          if ([regex]::Matches($lock, $pattern).Count -ne 1) {
            throw 'The crossterm lock entry has changed; review the override.'
          }
          [IO.File]::WriteAllText($lockPath, [regex]::Replace($lock, $pattern, ''))
          git diff -- codex-rs/Cargo.toml codex-rs/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Could not display the dependency override.' }

      - name: Build Codex and its Windows helper executables
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked --profile dev-small --target x86_64-pc-windows-msvc --timings \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy \
            --bin codex-windows-sandbox-setup \
            --bin codex-windows-sandbox-service \
            --bin codex-command-runner \
            --bin codex-app-server \
            2>&1 | tee ../codex-windows-build.log

      - name: Check that the CLI starts
        shell: pwsh
        run: |
          & ./codex-target/x86_64-pc-windows-msvc/dev-small/codex.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'The built Codex executable could not start.' }

      - name: Upload the patched Windows Codex build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-ctrl-c
          path: codex-target/x86_64-pc-windows-msvc/dev-small/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs and timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-ctrl-c-build-logs
          path: |
            codex-windows-build.log
            codex-target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
